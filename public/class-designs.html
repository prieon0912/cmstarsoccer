<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Awards & Legends · 클래스 디자인</title><link rel="stylesheet" href="/design-preview.css?v=classes-6"><link rel="stylesheet" href="/pack-reveal.css?v=classes-6"><style>
*{box-sizing:border-box}body{margin:0;background:#0c111a;color:#f4eee1;font-family:system-ui,sans-serif}main{width:min(1240px,calc(100% - 48px));margin:auto;padding:52px 0}header{border-bottom:1px solid #3e3930;padding-bottom:28px;margin-bottom:32px;display:flex;justify-content:space-between;gap:20px;align-items:end}.eyebrow{color:#c0a26b;font-size:10px;letter-spacing:.28em}h1{font-family:Georgia,serif;font-size:clamp(36px,5vw,60px);font-weight:400;letter-spacing:-.04em;margin:12px 0}header p{font-size:12px;line-height:1.9;color:#a5acb6}header a{color:#d7bd83;font-size:12px;text-decoration:none}.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.variant{border:1px solid #3e3930;border-radius:16px;background:radial-gradient(ellipse at 50% 0,#28231c,#111824 65%);padding:22px 18px;overflow:hidden}.variant figure{margin:0;display:flex;justify-content:center;padding:16px 0 22px;filter:drop-shadow(0 15px 20px #0005)}.variant .design-card{padding:29px 17px 35px}.variant h2{font-size:16px;font-weight:550;margin:4px 0 8px}.variant p{font-size:11px;line-height:1.8;color:#a5acb6;min-height:40px}.variant .tag{font-size:9px;letter-spacing:.18em;color:#c0a26b}.variant button{display:block;width:100%;padding:13px;border-radius:8px;color:#eed9ad;border:1px solid #88724b;background:transparent;font-size:12px;cursor:pointer}.variant button:hover{background:#b7985e20}.foot{margin-top:26px;color:#798596;font-size:11px;line-height:1.8}@media(max-width:1000px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:540px){main{width:calc(100% - 28px);padding-top:30px}.gallery{grid-template-columns:1fr}header{display:block}}
</style><script src="/data/class-designs.js?v=classes-6"></script><script src="/pack-reveal.js?v=classes-6"></script><script src="/design-preview.js?v=classes-6"></script></head>
<body><main><header><div><span class="eyebrow">FLOODLIGHT ELEVEN / CLASS DESIGN STUDIO</span><h1>Awards &amp; Legends</h1><p>발롱도르와 ICON. 네 가지 카드 디자인과 각 디자인에 맞춘 선수 등장 연출.</p></div><a href="/admin/">관리자 화면으로 →</a></header><div class="gallery" id="gallery"></div><p class="foot">표시된 선수명과 능력치는 디자인 확인용 예시입니다. 실제 선수 데이터와 확률은 관리자에서 설정합니다.<br>동작 줄이기 설정을 사용하면 간단한 공개 화면으로 전환됩니다.</p></main><script>
const descriptions={'ballon-gold':'검정·샴페인 골드 / 황금공 트로피와 시상식 스포트라이트','ballon-midnight':'딥 네이비·골드 / 황금공 클로즈업과 금빛 궤도','icon-ivory':'아이보리·골드 / 바닥 각인, 월계관 문장, 빛의 응집','icon-obsidian':'옵시디언·골드 / 문장 소환, 파편 흡수, 빛의 파동'};
document.getElementById('gallery').innerHTML=Object.values(FL11_DESIGNS).map(p=>{const cls={...p,name:p.id.startsWith('ballon')?'발롱도르':'ICON'};return `<article class="variant"><span class="tag">${p.id.toUpperCase()}</span><figure>${FL11DesignPreview.card(cls)}</figure><h2>${p.label}</h2><p>${descriptions[p.id]}</p><button data-play="${p.id}">뽑기 연출 재생 ↗</button></article>`;}).join('');
FL11PackReveal.preload();
document.getElementById('gallery').addEventListener('click',e=>{const b=e.target.closest('[data-play]');if(!b)return;const p=FL11_DESIGNS[b.dataset.play];FL11DesignPreview.play({...p,name:p.id.startsWith('ballon')?'발롱도르':'ICON'});});
</script></body></html>
